{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{{ title }} | DevBlog</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

<style>
body { background: #f8f9fa; color:#212529; transition:.3s; }
body.dark { background:#121212; color:#eee; }
body.dark .navbar, body.dark footer, body.dark .about-card, body.dark .team-member { background:#1e1e1e; color:#fff; border-color:#333; }
body.dark .text-muted { color:#aaa !important; }

.navbar-brand { font-weight:700; font-size:1.4rem; }
.nav-actions{ display:flex; align-items:center; gap:6px; }
.lang-btn{ font-size:11px; padding:3px 6px; border-radius:6px; border:1px solid #444; background:#222; color:#fff; cursor:pointer; }
.lang-btn.active{ background:#0d6efd; border-color:#0d6efd; }
.theme-btn{ width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; }

.about-card {
  background: #fff;
  padding: 40px;
  border-radius: 16px;
  box-shadow: 0 6px 20px rgba(0,0,0,0.08);
  text-align: center;
  transition:.3s;
}
.about-card h2 { font-weight:700; margin-bottom:15px; }
.about-card p.lead { font-size:1.1rem; color:#495057; margin-bottom:30px; }

.team-member {
  background: #f1f3f5;
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 20px;
  border: 1px solid #dee2e6;
  transition: all 0.3s ease;
}
body.dark .team-member { background:#2a2a2a; border-color:#444; color:#eee; }
.team-member:hover { transform: translateY(-5px); background:#e9ecef; }
body.dark .team-member:hover { background:#333; }

.social-icons a {
  margin:0 6px; font-size:1.3rem; color:#495057; transition:.2s;
}
body.dark .social-icons a { color:#ccc; }
.social-icons a:hover { color:#0d6efd; }
.social-icons { margin-top:8px; }

footer { font-size:0.9rem; letter-spacing:0.5px; transition:.3s; }
</style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
<div class="container">
  <a class="navbar-brand" href="/">DevBlog</a>
  <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
    <span class="navbar-toggler-icon"></span>
  </button>

  <div class="collapse navbar-collapse" id="navbarNav">
    <ul class="navbar-nav me-auto">
      <li class="nav-item"><a class="nav-link" href="/">Home/a></li>
      <li class="nav-item"><a class="nav-link" href="{% url 'blog:contact' %}">Contact</a></li>
    </ul>

    <div class="nav-actions">
      <button class="lang-btn active" onclick="setLang('uz')">UZ</button>
      <button class="lang-btn" onclick="setLang('ru')">RU</button>
      <button class="lang-btn" onclick="setLang('en')">EN</button>

      <button class="btn btn-outline-light theme-btn" id="themeToggle">
        <i id="themeIcon" class="bi bi-moon-fill"></i>
      </button>
    </div>
  </div>
</div>
</nav>

<!-- ABOUT SECTION -->
<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="about-card">
        <h2>{{ title }}</h2>
        <p class="lead">{{ description }}</p>
        <hr>
        <h4>Our channel</h4>
        <div class="row mt-4">
          {% for member in team %}
          <div class="col-md-4 col-sm-6">
            <div class="team-member text-center">
              <div class="social-icons">
                {% if member.telegram %}
                  <a href="{{ member.telegram }}" target="_blank" title="Telegram"><i class="bi bi-telegram"></i></a>
                {% endif %}
                {% if member.instagram %}
                  <a href="{{ member.instagram }}" target="_blank" title="Instagram"><i class="bi bi-instagram"></i></a>
                {% endif %}
                {% if member.youtube %}
                  <a href="{{ member.youtube }}" target="_blank" title="YouTube"><i class="bi bi-youtube"></i></a>
                {% endif %}
              </div>
            </div>
          </div>
          {% endfor %}
        </div>
      </div>
    </div>
  </div>
</div>

<footer class="bg-dark text-white-50 text-center py-3">© 2026 DevBlog</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
/* ===== DARK MODE ===== */
const body=document.body, icon=document.getElementById("themeIcon");
if(localStorage.getItem("theme")==="dark"){ body.classList.add("dark"); icon.className="bi bi-sun-fill"; }
document.getElementById("themeToggle").onclick=()=>{
 body.classList.toggle("dark");
 const dark=body.classList.contains("dark");
 localStorage.setItem("theme",dark?"dark":"light");
 icon.className=dark?"bi bi-sun-fill":"bi bi-moon-fill";
};
</script>

</body>
</html>
